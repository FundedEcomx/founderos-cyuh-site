<script>
// FAQ accordion
document.querySelectorAll('.faq-item').forEach(function(item){
  item.addEventListener('click',function(){
    var answer=this.querySelector('.faq-answer');
    var chevron=this.querySelector('.faq-chevron');
    var isOpen=this.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(function(i){
      i.classList.remove('open');
      i.querySelector('.faq-answer').style.maxHeight='0';
      i.querySelector('.faq-chevron').textContent='+';
    });
    if(!isOpen){this.classList.add('open');answer.style.maxHeight=answer.scrollHeight+'px';chevron.textContent='\\u00d7';}
  });
});
// Nav scroll
window.addEventListener('scroll',function(){document.querySelector('nav').classList.toggle('scrolled',window.scrollY>50);});
// Hamburger menu
var ham=document.querySelector('.hamburger');var nl=document.querySelector('.nav-links');if(ham&&nl){ham.addEventListener('click',function(){nl.classList.toggle('open');});}
// Picker tabs
document.querySelectorAll('.picker-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    var target=this.dataset.tab;
    document.querySelectorAll('.picker-tab').forEach(function(t){t.classList.remove('active');});
    document.querySelectorAll('.picker-content').forEach(function(c){c.classList.remove('active');});
    this.classList.add('active');
    var el=document.getElementById(target);
    if(el){el.classList.add('active');}
  });
});
// Picker card select
document.querySelectorAll('.picker-card').forEach(function(card){
  card.addEventListener('click',function(){
    var parent=this.closest('.picker-content');
    if(parent){parent.querySelectorAll('.picker-card').forEach(function(c){c.classList.remove('selected');});}
    this.classList.add('selected');
  });
});
</script>
<script>document.querySelectorAll('.faq-item').forEach(function(item){item.addEventListener('click',function(){var answer=this.querySelector('.faq-answer');var chevron=this.querySelector('.faq-chevron');var isOpen=this.classList.contains('open');document.querySelectorAll('.faq-item').forEach(function(i){i.classList.remove('open');i.querySelector('.faq-answer').style.maxHeight='0';i.querySelector('.faq-chevron').textContent='+';});if(!isOpen){this.classList.add('open');answer.style.maxHeight=answer.scrollHeight+'px';chevron.textContent='×';}});});window.addEventListener('scroll',function(){document.querySelector('nav').classList.toggle('scrolled',window.scrollY>50);});</script>
